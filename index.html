}

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border-radius:16px;
  transition:transform .2s var(--easing),box-shadow .2s var(--easing),border-color .2s var(--easing);

  cursor:pointer;
}
.glass-card:hover{
  transform:translateY(-2px);

  from { opacity:0; transform:scale(.92) translateY(16px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}
.card-stagger {
  animation: cardStaggerIn .5s var(--easing) both;
}

.kpi-card{
  position:relative;overflow:hidden;

.kpi-card:hover{
  transform:translateY(-2px);

  border-color:rgba(30,64,175,.2);
}
.kpi-card .kpi-bullet-bar{
  height:6px;border-radius:4px;margin-top:14px;
  background:rgba(51,65,85,.4);
  position:relative;overflow:visible;
}
.kpi-card .kpi-bullet-fill{
  height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--kpi-color,#1E40AF),var(--kpi-color-glow,#3B82F6));
  transition:width .6s var(--easing);
  max-width:100%;
}
.kpi-card .kpi-bullet-target{
  position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;
  background:var(--kpi-target-color,#D97706);

// ─── Debounce ────────────────────────────────────
function useDebounce(value, delay=300) {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const t = setTimeout(() => setDebounced(value), delay);
    return () => clearTimeout(t);
  }, [value, delay]);
  return debounced;
}

// ─── Supabase Client ─────────────────────────────
const supabase = window.supabase?.createClient(SUPABASE_URL, SUPABASE_KEY) || null;

async function saveToSupabase(url, status, notes) {
  if (!supabase) return false;
  try {
    const { error } = await supabase.from('job_status').upsert({
      url, status, notes: notes || '', updated_at: new Date().toISOString()
    }, { onConflict: 'url' });
    return !error;
  } catch { return false; }
}

async function saveBlockReason(url, title, reason) {
  if (!supabase) return false;
  try {
    const { error } = await supabase.from('job_blacklist').upsert({
      url, reason: `Bloqueado: ${reason} — "${title.substring(0,100)}"`,
      reason_type: 'blocked', processed: false,
      is_active: true, created_at: new Date().toISOString()
    }, { onConflict: 'url' });
    return !error;
  } catch { return false; }
}

// ─── API ────────────────────────────────────────
const API_BASE = '/api';
async function apiCall(data) {
  try {
    const res = await fetch(`${API_BASE}/vagas/status`, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({url: data.url, status: data.status, notas: data.notes || '', timestamp: new Date().toISOString()})
    });
    return res.ok;
  } catch { return false; }
}

// ─── Toast System ───────────────────────────────
const ToastContext = createContext();

function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const addToast = useCallback((msg, type='info') => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, {id, msg, type}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
  }, []);

  const toastConfig = {
    success: { bg: 'rgba(16,185,129,.9)', icon: ICONS.check },
    error:   { bg: 'rgba(239,68,68,.9)',  icon: ICONS.xMark },
    warning: { bg: 'rgba(217,119,6,.9)',  icon: ICONS.exclamation },
    info:    { bg: 'rgba(59,130,246,.9)',   icon: ICONS.information },
  };

  return (
    <ToastContext.Provider value={addToast}>
      {children}
      <div aria-live="polite" role="status" style={{position:'fixed',top:24,right:24,zIndex:2000,display:'flex',flexDirection:'column',gap:10}}>
        {toasts.map(t => (
          <div key={t.id} className="toast" style={{background: (toastConfig[t.type]||toastConfig.info).bg, color:'white'}}>
            <SvgIcon d={(toastConfig[t.type]||toastConfig.info).icon} size={18}/>
            {t.msg}
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}

function extractLabel(row) {
  const stack = (row.stack || []).map(String);
  const summary = (row.summary || '').toLowerCase();
  const keywords = {
    n8n: ['n8n'], pipefy: ['pipefy'], 'Automação': ['automação', 'rpa', 'automation', 'workflow'],
    IA: ['inteligência artificial', 'machine learning', 'deep learning', 'llm', 'chatgpt', 'openai', 'langchain'],
    Dados: ['dados', 'data engineer', 'data science', 'analytics', 'power bi', 'tableau', 'sql', 'etl', 'big data'],
    Dev: ['desenvolvedor', 'developer', 'programador', 'full stack', 'frontend', 'backend', 'react', 'node', 'python', 'java', '.net', 'golang'],
    Cloud: ['cloud', 'aws', 'azure', 'gcp', 'devops', 'kubernetes', 'docker', 'terraform'],
    'Low-Code': ['low-code', 'low code', 'no-code', 'bubble', 'retool', 'power apps'],
    Processos: ['processos', 'bpm', 'bpmn', 'process', 'melhoria contínua', 'lean', 'six sigma'],
    Projetos: ['projetos', 'project', 'pmbok', 'scrum', 'agile', 'ágil', 'kanban'],
    CRM: ['crm', 'salesforce', 'hubspot', 'zendesk', 'customer success'],
    ERP: ['erp', 'sap', 'oracle', 'totvs'],
    BI: ['bi', 'business intelligence', 'dashboard', 'kpi'],
    Analista: ['analista', 'analyst', 'análise'],
    Designer: ['design', 'ux', 'ui', 'figma'],
    Marketing: ['marketing', 'mídia', 'seo', 'sem', 'growth', 'conteúdo'],
  };
  const str = [...stack, summary].join(' ').toLowerCase();
  for (const [cat, terms] of Object.entries(keywords)) {
    if (terms.some(t => str.includes(t))) return cat;
  }
  return row.query_label || 'Outros';
}

  } catch (e) { console.error('fetchJobs:', e); return []; }
}

// ─── KPI Cards — Bullet Chart Style ─────────────
function KpiCard({ iconD, iconBg, label, value, sub, delta, trend, idx, bulletPct, bulletTargetPct, bulletColor }) {
  const trendLabel = trend === 'up' ? 'UP' : trend === 'down' ? 'DOWN' : '';
  const trendColor = trend === 'up' ? '#34d399' : trend === 'down' ? '#f87171' : '#94a3b8';

  const barColors = ['#1E40AF','#10b981','#3B82F6','#D97706','#EF4444'];
  const color = bulletColor || barColors[(idx||0) % barColors.length];
  const targetColor = '#D97706';

  return (
    <div className={`kpi-card slide-up-d${(idx||0)+1}`}>
      <div className="flex items-start gap-3 relative z-10">
        <div className="kpi-icon" style={{
          background: `${iconBg||'rgba(30,64,175,.15)'}`,
          boxShadow: `0 4px 16px ${iconBg||'rgba(30,64,175,.2)'}`
        }}>
          <SvgIcon d={iconD||ICONS.chart} size={22} style={{color:'#60a5fa'}}/>
        </div>
        <div className="min-w-0 flex-1">
          <div className="flex items-baseline gap-2 flex-wrap">
            <span className="text-2xl lg:text-3xl font-bold text-white tracking-tight font-mono">{value}</span>
            {delta && (
              <span className="text-xs font-semibold flex items-center gap-1 font-mono" style={{color:trendColor}}>
                {trendLabel} {delta}
              </span>
            )}
          </div>
          <div className="text-xs text-gray-400 mt-1 font-medium tracking-wider uppercase font-sans"
            style={{letterSpacing:'.12em'}}>{label}</div>
          {sub && <div className="text-[10px] text-gray-600 mt-0.5 font-mono">{sub}</div>}
        </div>
      </div>
      {/* Bullet chart bar */}
      <div className="kpi-bullet-bar relative z-10">
        <div className="kpi-bullet-fill" style={{
          '--kpi-color': color,
          '--kpi-color-glow': color+'cc',
          width: `${Math.min(bulletPct||50, 100)}%`
        }}></div>
        {bulletTargetPct !== undefined && bulletTargetPct !== null && (
          <div className="kpi-bullet-target" style={{
            left: `${Math.min(bulletTargetPct, 100)}%`,
            '--kpi-target-color': targetColor
          }}></div>
        )}
      </div>
    </div>
  );
}

function KpiRow({ jobs, filteredCount }) {
  const total = jobs.length;
  const avgScore = total ? Math.round(jobs.reduce((s,j)=>s+(j.fit_score||0),0)/total) : 0;
  const remoteCount = jobs.filter(j => {
    const m = (j.work_model||'').toLowerCase();
    return m.includes('remoto')||m.includes('remote')||m.includes('híbr')||m.includes('hybrid');
  }).length;
  const seniorities = jobs.map(j=>j.seniority).filter(Boolean);
  const topSeniority = [...new Set(seniorities)].slice(0,2).join(' · ') || '—';
  const pendingCount = jobs.filter(j=>(j._status||'pending')==='pending').length;
  const pctRemote = total ? Math.round(remoteCount/total*100) : 0;
  const scoreTarget = 65; // target match score

  return (
    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 lg:gap-4 mb-10">
      <KpiCard idx={0} iconD={ICONS.document} iconBg="rgba(30,64,175,.15)"
        label="Total de Vagas" value={total}
        sub={`${filteredCount} exibidas`}
        bulletPct={Math.min(total>0?100:0,100)} bulletTargetPct={null} bulletColor="#1E40AF"/>
      <KpiCard idx={1} iconD={ICONS.target} iconBg="rgba(16,185,129,.15)"
        label="Match Medio AI" value={`${avgScore}%`}
        sub={avgScore>=60?'Forte':avgScore>=35?'Moderado':'Baixo'}
        delta={avgScore>=60?'Alta compatibilidade':null} trend={avgScore>=60?'up':'flat'}
        bulletPct={Math.min(avgScore,100)} bulletTargetPct={scoreTarget} bulletColor="#10b981"/>
      <KpiCard idx={2} iconD={ICONS.home} iconBg="rgba(30,64,175,.15)"
        label="Remotas/Hibridas" value={remoteCount}
        sub={`${pctRemote}% do total`} delta={`${pctRemote}%`} trend="up"
        bulletPct={Math.min(pctRemote,100)} bulletTargetPct={50} bulletColor="#3B82F6"/>
      <KpiCard idx={3} iconD={ICONS.trending} iconBg="rgba(239,68,68,.15)"
        label="Senioridade Top" value={topSeniority==='—'?'N/D':topSeniority}
        sub={`${pendingCount} pendentes`}
        bulletPct={topSeniority!=='—'?70:10} bulletTargetPct={null} bulletColor="#EF4444"/>
    </div>
  );
}

// ─── Job Row (lista v3) ─────────────────────────
function JobRow({ job, onRemove, idx }) {
  const addToast = useContext(ToastContext);
  const [status, setStatus] = useState(job._status || 'pending');
  const [expanded, setExpanded] = useState(false);
  const [modal, setModal] = useState(null);
  const [notes, setNotes] = useState(job._notes || '');
  const [hiding, setHiding] = useState(false);

  const handleAction = async (newStatus) => {
    if (newStatus === 'discard' || newStatus === 'expire' || newStatus === 'block') {
      setModal(newStatus);
      return;
    }
    const target = (newStatus === 'favorita' && status === 'favorita') || (newStatus === 'inscrito' && status === 'inscrito') ? 'pending' : newStatus;
    await applyStatus(target);
  };

  const applyStatus = async (newStatus) => {
    const old = status;
    setStatus(newStatus);
    setModal(null);

    const [supOk, apiOk] = await Promise.all([
      saveToSupabase(job.url, newStatus, notes),
      apiCall({ url: job.url, status: newStatus, notes })
    ]);

    if (!supOk && !apiOk) {
      setStatus(old);
      addToast('Erro ao salvar', 'error');
      return;
    }

    const msgs = {
      descartada:'Vaga removida', expirada:'Expirada', pending:'Restaurada',
      inscrito:'Inscrito!'
    };
    addToast(msgs[newStatus]||'Atualizado', (newStatus==='descartada'||newStatus==='expirada')?'warning':'success');

    if (newStatus === 'descartada' || newStatus === 'expirada') {
      setHiding(true);
      setTimeout(() => onRemove(job.url), 350);
    }
  };

  const score = job.fit_score || job.score || 0;
  const fitTier = score >= 75 ? 'strong' : score >= 60 ? 'good' : score >= 45 ? 'moderate' : score >= 30 ? 'weak' : '';
  const verdict = (job.ai_match && job.ai_match.verdict) || (score>=75?'Strong':score>=60?'Good':score>=45?'Moderate':score>=30?'Weak':'Poor');
  const scColor = score >= 60 ? '#34d399' : score >= 30 ? '#fbbf24' : '#94a3b8';
  const verdictColor = score >= 75 ? '#10b981' : score >= 60 ? '#34d399' : score >= 45 ? '#f59e0b' : '#ef4444';
  const dims = [
    ['T', job.ai_match && job.ai_match.tech_score, '#60a5fa'],
    ['E', job.ai_match && job.ai_match.exp_score, '#34d399'],
    ['C', job.ai_match && job.ai_match.cultura_score, '#fbbf24'],
    ['A', job.ai_match && job.ai_match.alinhamento_score, '#c084fc'],
  ];
  const stack = (job.stack || []).slice(0, 2);
  const stackMore = (job.stack || []).length - 2;

  return (
    <>
      <ConfirmModal open={modal==='discard'}
        title="Descartar vaga"
        message={`"${job.title?.substring(0,70)}…" sera removida da grade de vagas.`}
        confirmLabel="Sim, descartar" confirmColor="danger" iconD={ICONS.trash}
        onConfirm={() => applyStatus('descartada')} onCancel={() => setModal(null)} />

      <ConfirmModal open={modal==='expire'}
        title="Expirar vaga"
        message={`"${job.title?.substring(0,70)}…" sera marcada como expirada e removida.`}
        confirmLabel="Sim, expirar" confirmColor="danger" iconD={ICONS.clock}
        onConfirm={() => applyStatus('expirada')} onCancel={() => setModal(null)} />

      <BlockModal open={modal==='block'} job={job}
        onConfirm={async (reason) => {
          await saveBlockReason(job.url, job.title, reason);
          await saveToSupabase(job.url, 'blocked', `Motivo: ${reason}`);
          addToast('Vaga bloqueada. Motivo registrado.', 'success');
          setHiding(true);
          setTimeout(() => onRemove(job.url), 350);
        }}
        onCancel={() => setModal(null)} />

      <div className={`job-row ${hiding?'job-hidden':''} ${expanded?'open':''}`} data-fit={fitTier}
        onClick={(e) => { if (e.target.closest('button,a,textarea,select')) return; setExpanded(!expanded); }}>
        {/* Vaga */}
        <div style={{minWidth:0}}>
          <div style={{fontSize:'13.5px',fontWeight:700,lineHeight:1.3,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
            <a href={job.url} target="_blank" rel="noopener noreferrer" style={{color:'inherit'}} onClick={e=>e.stopPropagation()}>{job.title || 'Sem titulo'}</a>
          </div>
          <div style={{fontSize:'11.5px',color:'#94a3b8',marginTop:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
            {job.company || 'Empresa'}{job.location ? ` · ${job.location}` : ''}
          </div>
        </div>

        {/* Badges */}
        <div style={{display:'flex',gap:5,overflow:'hidden',alignItems:'center'}}>
          {job.work_model && <span className="badge" style={{background:'rgba(37,99,235,.14)',color:'#93c5fd',border:'1px solid rgba(37,99,235,.2)',fontFamily:'var(--font-mono)',fontSize:10.5,padding:'3px 8px',borderRadius:6,whiteSpace:'nowrap'}}>{job.work_model}</span>}
          {job.seniority && <span className="badge" style={{background:'rgba(245,158,11,.13)',color:'#fcd34d',border:'1px solid rgba(245,158,11,.2)',fontFamily:'var(--font-mono)',fontSize:10.5,padding:'3px 8px',borderRadius:6,whiteSpace:'nowrap'}}>{job.seniority}</span>}
          {stack.map(s => <span key={s} className="badge" style={{background:'rgba(129,140,248,.12)',color:'#c7d2fe',border:'1px solid rgba(129,140,248,.2)',fontFamily:'var(--font-mono)',fontSize:10.5,padding:'3px 8px',borderRadius:6,whiteSpace:'nowrap'}}>{s}</span>)}
          {stackMore > 0 && <span className="badge" style={{background:'rgba(255,255,255,.04)',color:'#64748b',border:'1px solid rgba(51,65,85,.4)',fontFamily:'var(--font-mono)',fontSize:10.5,padding:'3px 8px',borderRadius:6,whiteSpace:'nowrap'}}>+{stackMore}</span>}
          {job.is_live === false && <span className="badge" style={{background:'rgba(239,68,68,.12)',color:'#f87171',border:'1px solid rgba(239,68,68,.2)',fontFamily:'var(--font-mono)',fontSize:10.5,padding:'3px 8px',borderRadius:6,whiteSpace:'nowrap'}}>link morto</span>}
        </div>

        {/* Fit */}
        <div>
          <div style={{display:'flex',alignItems:'baseline',gap:6}}>
            <span style={{fontSize:17,fontWeight:800,fontFamily:'var(--font-mono)',color:scColor,lineHeight:1}}>{score}</span>
            <span style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',color:verdictColor}}>{verdict}</span>
          </div>
          <div className="fit-dims">
            {dims.map(([l,v,c]) => (
              <div key={l} className="fit-dim" title={`${l} ${v!=null?v:'—'}`}>
                <div className="trk"><i style={{width:`${v!=null?v:0}%`,background:c}} /></div>
                <b>{l}</b>
              </div>
            ))}
          </div>
        </div>

        {/* Ações */}
        <div className="job-actions-v3">
          <button className="act-v3 fav" title="Favoritar" aria-label="Favoritar vaga" onClick={(e)=>{e.stopPropagation();handleAction('favorita');}}><SvgIcon d={ICONS.star} size={13}/></button>
          <button className="act-v3 apply" title="Inscrito" aria-label="Marcar como inscrito" onClick={(e)=>{e.stopPropagation();handleAction('inscrito');}}><SvgIcon d={ICONS.check} size={13}/></button>
          <button className="act-v3" title="Bloquear" aria-label="Bloquear vaga" onClick={(e)=>{e.stopPropagation();handleAction('block');}}><SvgIcon d={ICONS.shield} size={13}/></button>
          <button className="act-v3" title="Expirar" aria-label="Marcar como expirada" onClick={(e)=>{e.stopPropagation();handleAction('expire');}}><SvgIcon d={ICONS.clock} size={13}/></button>
          <button className="act-v3 discard" title="Descartar" aria-label="Descartar vaga" onClick={(e)=>{e.stopPropagation();handleAction('discard');}}><SvgIcon d={ICONS.trash} size={13}/></button>
          <span className="row-chev"><SvgIcon d={ICONS.chevronDown} size={12}/></span>
        </div>
      </div>

      {expanded && (
        <div className="job-detail">
          {job.summary && <p className="sum">{job.summary}</p>}
          {job.ai_match && (job.ai_match.strengths?.length>0 || job.ai_match.gaps?.length>0) && (
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18,marginTop:12}}>
              {job.ai_match.strengths?.length>0 && (
                <div><h4>Pontos fortes</h4><ul>{job.ai_match.strengths.slice(0,3).map((s,i)=><li key={i}>{s}</li>)}</ul></div>
              )}
              {job.ai_match.gaps?.length>0 && (
                <div><h4>Lacunas</h4><ul>{job.ai_match.gaps.slice(0,2).map((g,i)=><li key={i} className="gap">{g}</li>)}</ul></div>
              )}
            </div>
          )}
          {job.ai_match && job.ai_match.recommendation && (
            <p style={{fontSize:11.5,color:'#cbd5e1',marginTop:12,fontStyle:'italic',borderTop:'1px solid rgba(51,65,85,.2)',paddingTop:12}}>{job.ai_match.recommendation}</p>
          )}
          {job.archetype && (
            <p style={{fontSize:11,color:'#64748b',marginTop:8,fontFamily:'var(--font-mono)'}}>Arquétipo: {job.archetype}</p>
          )}
          <div style={{marginTop:12}}>
            <label style={{fontSize:10,fontWeight:600,color:'#64748b',textTransform:'uppercase',letterSpacing:'.08em',display:'block',marginBottom:6,fontFamily:'var(--font-mono)'}}>Notas</label>
            <textarea rows="2" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Anotacoes sobre esta vaga…"
              aria-label="Anotações sobre esta vaga"
              style={{width:'100%',background:'rgba(255,255,255,.03)',border:'1px solid rgba(51,65,85,.4)',borderRadius:10,padding:10,fontSize:12,color:'#e2e8f0',resize:'none',fontFamily:'var(--font-sans)'}} />
          </div>
        </div>
      )}
    </>
  );
}

// ─── App ────────────────────────────────────────
function App() {
  const [jobs, setJobs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filters, setFilters] = useState({ search:'', category:'', model:'', sort:'score', status:'pending' });
  const [searchRaw, setSearchRaw] = useState('');
  const debouncedSearch = useDebounce(searchRaw, 300);

  useEffect(() => { setFilters(f => ({...f, search: debouncedSearch})); }, [debouncedSearch]);

  useEffect(() => {
    fetchJobs().then(j => { setJobs(j); setLoading(false); }).catch(() => setLoading(false));
  }, []);

  const removeJob = useCallback((url) => {
    setJobs(prev => prev.filter(j => j.url !== url));
  }, []);

  const filtered = useMemo(() => {
    let r = [...jobs];
    if (filters.search) { const s = filters.search.toLowerCase(); r = r.filter(j => (j.title||'').toLowerCase().includes(s) || (j.company||'').toLowerCase().includes(s)); }
    if (filters.category) r = r.filter(j => j.query_label === filters.category);
    if (filters.model) r = r.filter(j => j.work_model === filters.model);
    if (filters.status) r = r.filter(j => (j._status||'pending') === filters.status);
    return r;
  }, [jobs, filters]);

  if (loading) return (
    <div className="flex flex-col items-center justify-center min-h-screen gap-5">
      <div className="w-14 h-14 rounded-2xl flex items-center justify-center animate-pulse"
        style={{background:'rgba(30,64,175,.15)',border:'1px solid rgba(30,64,175,.2)'}}>
        <SvgIcon d={ICONS.search} size={26} style={{color:'#60a5fa'}}/>
      </div>
      <div className="text-lg text-accent-glow font-bold animate-pulse font-sans">{'Buscando vagas…'}</div>
      <div className="text-xs text-gray-600 font-mono">Conectando ao Supabase</div>
    </div>
  );

  return (
    <ToastProvider>
      <div className="min-h-screen" style={{background:'#020617'}}>
        {/* Topbar */}
        <header className="topbar-v3">
          <div className="brand-v3">
            <div className="brand-mark">JH</div>
            <span>Headhunter Preditivo</span>
          </div>
          <div className="search-v3">
            <SvgIcon d={ICONS.search} size={14} style={{color:'#64748b'}}/>
            <input type="text" placeholder="Buscar cargo ou empresa…" value={searchRaw} onChange={e=>setSearchRaw(e.target.value)} aria-label="Buscar vagas por cargo ou empresa" autoComplete="off" spellCheck="false" />
          </div>
          <div style={{display:'flex',gap:6,marginLeft:'auto',overflowX:'auto'}}>
            {[
              {label:'Pendentes',status:'pending'},
              {label:'Todas',status:''},
              {label:'Favoritas',status:'favorita'},
              {label:'Inscritas',status:'inscrito'},
              {label:'Descartadas',status:'descartada'},
            ].map(p => {
              const active = p.status ? filters.status===p.status : !filters.status;
              const n = p.status ? jobs.filter(j=>j._status===p.status).length : jobs.length;
              return (
                <button key={p.status} className={`chip-v3 ${active?'active':''}`} onClick={()=>setFilters({...filters,status:p.status})}>
                  {p.label} <span style={{fontFamily:'var(--font-mono)',fontSize:11}}>{n}</span>
                </button>
              );
            })}
          </div>
          <span style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:11,color:'#10b981',fontFamily:'var(--font-mono)',whiteSpace:'nowrap'}}>
            <span className="pulse-dot"></span>pipeline ativo
          </span>
        </header>

        <div className="app-shell">
          <aside className="sidebar-v3">
            <Sidebar filters={filters} setFilters={setFilters} jobs={jobs} />
          </aside>

          <main className="main-v3">
            <KpiRow jobs={jobs} filteredCount={filtered.length} />
            <ChartSection jobs={filtered} />

            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',margin:'4px 0 12px'}}>
              <h2 style={{fontSize:14,fontWeight:700,color:'#e2e8f0'}}>Vagas com melhor fit</h2>
              <span style={{fontFamily:'var(--font-mono)',fontSize:11,color:'#64748b'}}>{filtered.length} de {jobs.length} · clique na linha para detalhes</span>
            </div>

            <div className="list-wrap">
              <div className="list-head">
                <span className="list-head-label">Vaga</span>
                <span className="list-head-label">Modelo · Senioridade · Stack</span>
                <span className="list-head-label">Fit</span>
                <span className="list-head-label right">Ações</span>
              </div>
              {filtered.map((job, i) => <JobRow key={job.url || i} job={job} onRemove={removeJob} idx={i} />)}
            </div>

            {filtered.length===0 && (
              <div className="text-center py-28">
                <div className="mb-6 opacity-30 flex justify-center">
                  <SvgIcon d={ICONS.search} size={56} style={{color:'#94a3b8'}}/>
                </div>
                <p className="text-gray-500 font-medium text-lg font-sans">Nenhuma vaga encontrada</p>
                <p className="text-xs text-gray-700 mt-1.5 font-sans">Tente ajustar os filtros ou limpar a busca.</p>
              </div>
            )}

            <footer className="text-center mt-16 py-8 border-t" style={{borderColor:'rgba(51,65,85,.2)'}}>
              <p className="text-[11px] text-gray-700 font-medium tracking-wide font-mono">
                Job Hunter v%%DEPLOY_VERSION%% · %%DEPLOY_TIME%% · Supabase + DeepSeek + React 18
              </p>
              <p className="text-[10px] text-gray-800 mt-1 font-mono">Design System: Financial Dashboard Dark · Blue/Amber · List Layout v3</p>
            </footer>
          </main>
        </div>
      </div>
    </ToastProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
